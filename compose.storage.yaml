# 可选独立宿主数据目录，必须为空且专用于该实例，不能指向其他数据库目录。
services:
  mysql:
    volumes:
      - type: bind
        source: ${RESEARCHDESK_MYSQL_DATA_DIR:?set a dedicated absolute RESEARCHDESK_MYSQL_DATA_DIR}
        target: /var/lib/mysql
        bind:
          create_host_path: false
